openapi: 3.1.0
info:
  title: Architectural Document Reviewer Backend
  version: 1.0.0

servers:
  - url: https://arch-doc-reviewer.onrender.com

paths:
  /create-review-pdf:
    post:
      operationId: create_review_pdf
      summary: Create an annotated revised PDF with missed architectural review items boxed.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - revised_pdf
                - findings_json
              properties:
                review_pdf:
                  type: string
                  format: binary
                  description: Marked-up review PDF.
                revised_pdf:
                  type: string
                  format: binary
                  description: Revised PDF to annotate.
                project_name:
                  type: string
                  default: Architectural_Document_Review
                findings_json:
                  type: string
                  description: JSON string array of findings with page_index, status, label, note, and optional bbox.
      responses:
        "200":
          description: Annotated PDF created.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
